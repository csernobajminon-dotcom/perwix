# Perwix boot menu: classic FreeBSD-loader layout with Perwix branding.
set default=0
set timeout=8
set timeout_style=menu

# Prefer the themed graphical terminal. GRUB falls back to its standard
# interactive text menu if the firmware/QEMU display has no graphics mode.
if insmod all_video; then
    if insmod gfxterm; then
        insmod png
        insmod gfxmenu
        set gfxmode=1280x720,1024x768,auto
        set gfxpayload=keep
        if [ -f /boot/grub/fonts/unicode.pf2 ]; then
            loadfont /boot/grub/fonts/unicode.pf2
        fi
        if [ -f /boot/grub/themes/perwix/theme.txt ]; then
            set theme=/boot/grub/themes/perwix/theme.txt
            export theme
        fi
        terminal_output gfxterm
    fi
fi

# These are GRUB color names, not HTML hex colors. The theme itself uses
# hexadecimal colors for its graphics widgets.
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

menuentry '1. Boot Perwix [Enter]' --id=perwix-multi {
    multiboot2 /boot/perwix.elf
    boot
}

menuentry '2. Boot Single-user' --id=perwix-single {
    multiboot2 /boot/perwix.elf single
    boot
}

# C is GRUB's native key for the loader command prompt. This entry exits
# normal mode into the GRUB command line when selected.
menuentry '3. Escape to loader prompt (C)' --id=perwix-loader-prompt {
    normal_exit
}

menuentry '4. Reboot' --id=perwix-reboot {
    reboot
}

menuentry '5. Kernel: default/perwix (1 of 1)' --id=perwix-kernel-default {
    multiboot2 /boot/perwix.elf
    boot
}

submenu '6. Boot Options' --id=perwix-options {
    menuentry 'Verbose startup' --id=perwix-verbose {
        multiboot2 /boot/perwix.elf verbose
        boot
    }

    menuentry 'Safe mode (skip network, USB and mouse)' --id=perwix-safe {
        multiboot2 /boot/perwix.elf safe
        boot
    }
}
